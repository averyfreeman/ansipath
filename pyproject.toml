[project]
name = "ansipath"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Avery Freeman", email = "avery@unixgreybeard.org" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ansipath = "ansipath.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ansipath"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]
