site_name: ansipath
site_url: https://averyfreeman.github.io/ansipath
repo_url: https://github.com/averyfreeman/ansipath
docs_dir: docs
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: dracula
      toggle:
        icon: material/weather-night
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
  highlightjs: true
  hljs_languages:
    - bash
    - json
    - python
    - sh
    - yaml
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js
  - javascripts/highlight.js
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css
  - stylesheets/dracula.css
nav:
  - Overview: index.md
  - Installation: installation.md
